<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f6f2" />
    <meta
      name="description"
      content="Klar — a calm, structured way to learn German."
    />
    <title>Klar — Learn German</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="onboardingRoot"></div>
    <div id="productRoot" hidden>
      <aside class="sidebar">
        <a class="brand" href="#dashboard"
          ><span class="brand-mark"><i></i><i></i><i></i></span>Klar</a
        >
        <nav class="side-nav" aria-label="App navigation">
          <button data-route="dashboard"><span>◫</span> Home</button>
          <button data-route="course"><span>□</span> Learn</button>
          <button data-route="review"><span>◇</span> Review</button>
          <button data-route="alphabet"><span>Ä</span> Alphabet</button>
          <button data-route="practice"><span>◌</span> Pronounce</button>
        </nav>
        <div class="sidebar-bottom">
          <button class="settings-link" data-action="restart">
            Reset setup
          </button>
          <p>German, made clear.</p>
        </div>
      </aside>
      <div id="ambientLetters" class="ambient-letters" aria-hidden="true"></div>
      <section class="app-shell">
        <header class="topbar">
          <div>
            <p class="topbar-label" id="topbarLabel">YOUR GERMAN SPACE</p>
            <h1 id="topbarTitle">Hello</h1>
          </div>
          <div class="topbar-meta">
            <span id="levelBadge">A1</span
            ><button
              class="avatar-button"
              data-route="progress"
              id="avatarButton"
            >
              K
            </button>
          </div>
        </header>
        <main id="app" class="app-content" tabindex="-1"></main>
      </section>
      <button
        id="chatToggle"
        class="chat-toggle"
        aria-label="Open conversation coach"
      >
        <span>✦</span> Practise
      </button>
      <aside
        id="chatDrawer"
        class="chat-drawer"
        aria-label="Klar conversation coach"
        aria-hidden="true"
      >
        <header>
          <div>
            <p>KLAR COACH</p>
            <h2>Practise a little.</h2>
          </div>
          <button id="chatClose" aria-label="Close chat">×</button>
        </header>
        <div id="chatMessages" class="chat-messages" aria-live="polite"></div>
        <div id="scenarioChips" class="scenario-chips"></div>
        <form id="chatForm" class="chat-form">
          <textarea
            id="chatInput"
            rows="2"
            placeholder="Write in German…"
            lang="de"
            required
          ></textarea
          ><button type="submit" aria-label="Send message">↑</button>
        </form>
        <p class="chat-note">
          Your coach corrects gently and stays at your level.
        </p>
      </aside>
      <nav class="mobile-nav" aria-label="Mobile navigation">
        <button data-route="dashboard">Home</button
        ><button data-route="course">Learn</button
        ><button data-route="alphabet">ABC</button
        ><button data-route="practice">Speak</button>
      </nav>
    </div>
    <div id="toast" class="toast" role="status"></div>
    <script src="data.js"></script>
    <script src="a2-data.js"></script>
    <script src="app.js"></script>

</html>
